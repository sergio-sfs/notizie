<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0f172a">
<title>Notizie</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#111827;--mu:#6b7280;--ac:#2563eb;--bd:#e5e7eb;--of:#16a34a}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#131c2e;--tx:#e5e7eb;--mu:#94a3b8;--ac:#60a5fa;--bd:#22304a;--of:#4ade80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 12px 6px;border-bottom:1px solid var(--bd)}
.top{display:flex;gap:8px;align-items:center}
h1{font-size:18px;margin:0;flex:0 0 auto}
input[type=search]{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:16px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab,.chip{flex:0 0 auto;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.tab.on{background:var(--ac);border-color:var(--ac);color:#fff}
.chip.on{background:var(--of);border-color:var(--of);color:#fff}
.tab small{opacity:.7;margin-left:4px}
.bar{display:flex;justify-content:space-between;align-items:center;color:var(--mu);font-size:12px;padding:4px 0}
main{max-width:720px;margin:0 auto;padding:8px 12px 40px}
.day{font-size:12px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.04em;margin:14px 2px 6px}
div.n{display:block;cursor:pointer;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px;color:inherit;text-decoration:none}
div.n:active{opacity:.85}
.n.read .t{color:var(--mu);font-weight:400}
.t{font-weight:600;font-size:15.5px}
.m{display:flex;gap:8px;flex-wrap:wrap;margin-top:5px;font-size:12px;color:var(--mu);align-items:center}
.x{color:var(--mu);font-size:13px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.of{color:var(--of);font-weight:600}
.tp{background:var(--bd);border-radius:6px;padding:0 6px}
.b{margin-top:10px;border-top:1px solid var(--bd);padding-top:10px;font-size:16px;line-height:1.55;cursor:auto;user-select:text}
.b p{margin:0 0 12px}.b h3{font-size:16px;margin:14px 0 6px}
.b .go{display:inline-block;margin:4px 0 2px;color:var(--ac);font-weight:600;text-decoration:none}
.caret{margin-left:auto;color:var(--ac)}
.empty{text-align:center;color:var(--mu);padding:40px 10px}
</style>
</head>
<body>
<header>
  <div class="top"><h1>📰 Notizie</h1><input id="q" type="search" placeholder="Cerca…"></div>
  <div class="tabs" id="tabs"></div>
  <div class="bar"><span id="upd"></span><span><button class="chip" id="key" title="Imposta chiave">🔑</button> <button class="chip" id="ref">⟳ Aggiorna</button> <button class="chip" id="off">✔ Solo ufficiali</button></span></div>
</header>
<main id="list"><div class="empty">Caricamento…</div></main>
<script>
const $=s=>document.querySelector(s);
let data={topics:[]},cur="all",onlyOff=false,q="";
let read={};try{read=JSON.parse(localStorage.getItem("read")||"{}")}catch(e){}
const saveRead=()=>{try{localStorage.setItem("read",JSON.stringify(read))}catch(e){}};
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtT=d=>d.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
function dayLabel(d){
  const t=new Date(),y=new Date(Date.now()-864e5),same=(a,b)=>a.toDateString()===b.toDateString();
  if(same(d,t))return"Oggi";if(same(d,y))return"Ieri";
  return d.toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"});
}
function items(){
  let out=[];
  data.topics.forEach(t=>{if(cur==="all"||cur===t.id)t.items.forEach(i=>out.push({...i,tp:t}))});
  if(onlyOff)out=out.filter(i=>i.o);
  if(q){const k=q.toLowerCase();out=out.filter(i=>(i.t+" "+i.s).toLowerCase().includes(k))}
  return out.sort((a,b)=>b.d.localeCompare(a.d));
}
function render(){
  $("#tabs").innerHTML=[{id:"all",name:"Tutte",emoji:"📰",n:data.topics.reduce((a,t)=>a+t.items.length,0)},
    ...data.topics.map(t=>({id:t.id,name:t.name,emoji:t.emoji,n:t.items.length}))]
    .map(t=>`<button class="tab ${t.id===cur?"on":""}" data-id="${t.id}">${t.emoji} ${esc(t.name)}<small>${t.n}</small></button>`).join("");
  $("#off").classList.toggle("on",onlyOff);
  $("#upd").textContent=data.updated?"Aggiornato "+new Date(data.updated).toLocaleString("it-IT",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"";
  const L=items();let last="",h="";
  L.forEach(i=>{
    const d=new Date(i.d),dl=dayLabel(d);
    if(dl!==last){h+=`<div class="day">${dl}</div>`;last=dl}
    h+=`<div class="n ${read[i.u]?"read":""}" data-u="${esc(i.u)}">
      <div class="t">${esc(i.t)}</div>${i.x&&i.x!==i.t?`<div class="x">${esc(i.x)}</div>`:""}
      <div class="m">${i.o?'<span class="of">✔ Ufficiale</span>':""}<span>${esc(i.s)}</span><span>${fmtT(d)}</span>${cur==="all"?`<span class="tp">${i.tp.emoji} ${esc(i.tp.name)}</span>`:""}<span class="caret">▾ Leggi</span></div><div class="b" hidden></div></div>`;
  });
  $("#list").innerHTML=h||'<div class="empty">Nessuna notizia.</div>';
}
document.addEventListener("click",e=>{
  const tb=e.target.closest(".tab");if(tb){cur=tb.dataset.id;render();scrollTo(0,0);return}
  if(e.target.closest("#off")){onlyOff=!onlyOff;render();return}
  if(e.target.closest(".b"))return;
  const a=e.target.closest(".n");if(a)toggle(a)
});
$("#q").addEventListener("input",e=>{q=e.target.value.trim();render()});
const cache={};
function parse(md){
  let t=md.includes("Markdown Content:")?md.split("Markdown Content:").slice(1).join(""):md;
  t=t.replace(/!\[[^\]]*\]\([^)]*\)/g,"").replace(/\[([^\]]*)\]\([^)]*\)/g,"$1").replace(/[*_`>]/g,"");
  const bl=t.split(/\n\s*\n/).map(x=>x.replace(/\s+/g," ").trim()).filter(Boolean);
  const good=bl.filter(x=>/^#{1,4} /.test(x)||x.length>=70);
  return (good.length>=3?good:bl).slice(0,80);
}
async function toggle(a){
  const b=a.querySelector(".b"),u=a.dataset.u,c=a.querySelector(".caret");
  if(!b.hidden){b.hidden=true;c.textContent="▾ Leggi";return}
  b.hidden=false;c.textContent="▴ Chiudi";read[u]=Date.now();saveRead();a.classList.add("read");
  const link=`<a class="go" href="${esc(u)}" target="_blank" rel="noopener noreferrer">↗ Apri sul sito originale</a>`;
  if(cache[u]){b.innerHTML=cache[u]+link;return}
  b.innerHTML='<p style="color:var(--mu)">Carico l\'articolo…</p>'+link;
  try{
    const r=await fetch("https://r.jina.ai/"+u);if(!r.ok)throw 0;
    const ps=parse(await r.text());if(!ps.length)throw 0;
    cache[u]=ps.map(x=>/^#{1,4} /.test(x)?`<h3>${esc(x.replace(/^#+ /,""))}</h3>`:`<p>${esc(x)}</p>`).join("");
    b.innerHTML=cache[u]+link;
  }catch(e){b.innerHTML='<p style="color:var(--mu)">Impossibile leggere qui (sito a pagamento o protetto).</p>'+link}
}
const load=()=>fetch("news.json?"+Date.now()).then(r=>r.json()).then(j=>{const ch=j.updated!==data.updated;data=j;render();return ch});
load().catch(()=>{$("#list").innerHTML='<div class="empty">Errore di caricamento.</div>'});
const getTok=()=>{try{return localStorage.getItem("gh")}catch(e){return null}};
$("#key").onclick=()=>{const t=prompt("Incolla la chiave GitHub (vuoto = rimuovi):",getTok()||"");if(t===null)return;try{t.trim()?localStorage.setItem("gh",t.trim()):localStorage.removeItem("gh")}catch(e){}};
$("#ref").onclick=async()=>{
  const b=$("#ref"),tok=getTok();b.disabled=true;
  try{
    if(tok){
      b.textContent="⏳ Avvio…";
      const r=await fetch("https://api.github.com/repos/sergio-sfs/notizie/actions/workflows/update.yml/dispatches",{method:"POST",headers:{Authorization:"Bearer "+tok,Accept:"application/vnd.github+json"},body:JSON.stringify({ref:"main"})});
      if(!r.ok){b.textContent=r.status===401||r.status===403||r.status===404?"❌ Chiave errata":"❌ Errore";return}
      for(let i=0;i<12;i++){b.textContent="⏳ "+(i+1)*10+"s";await new Promise(s=>setTimeout(s,10000));if(await load())break}
    }else await load();
    b.textContent="✅ Fatto";
  }catch(e){b.textContent="❌ Errore"}
  finally{setTimeout(()=>{b.textContent="⟳ Aggiorna";b.disabled=false},3000)}
};
</script>
</body>
</html>
