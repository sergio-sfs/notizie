name: Aggiorna notizie
on:
  schedule: [{cron: "0 */2 * * *"}]
  workflow_dispatch:
  push:
    paths: ["scripts/fetch.py", ".github/workflows/update.yml"]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch.py
      - run: |
          git config user.name "notizie-bot"; git config user.email "bot@users.noreply.github.com"
          git add docs/news.json
          git diff --cached --quiet || (git commit -m "Aggiorna notizie" && git push)
